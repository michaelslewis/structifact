# SYNTHETIC EXAMPLE (fictional data) — scoping/demonstration material
# for Phase 6 (Data Quality Framework). v1 used only required/
# accepted_values/primary_key. Phase 6 v2 adds range (min_value/
# max_value) and pattern validation on top — see discount_pct and
# order_id below.

dataset:
  name: orders_data
  description: >
    Small synthetic order dataset with intentional data-quality
    violations, for demonstrating Phase 6 (Data Quality Framework).

fields:
  - name: order_id
    type: string
    nullable: false
    pattern: "^ORD-[0-9]+$"

  - name: customer_id
    type: string
    nullable: false

  - name: order_type
    type: string
    nullable: false
    accepted_values: ["STD", "RET", "CRM"]

  - name: quantity
    type: integer
    nullable: false

  - name: unit_price
    type: decimal
    precision: 9
    scale: 2
    nullable: false

  - name: discount_pct
    type: decimal
    precision: 5
    scale: 4
    nullable: true
    min_value: 0
    max_value: 1

constraints:
  - type: primary_key
    columns: ["order_id"]
