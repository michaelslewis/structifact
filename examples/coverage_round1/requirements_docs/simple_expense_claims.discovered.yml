dataset:
  name: "employee_expense_claims"

fields:
  - name: "claim_id"
    description: "Unique identifier for the expense claim"
    role: "dimension"
    type: "varchar(12)"

  - name: "employee_id"
    description: "Employee who submitted the claim"
    role: "dimension"
    type: "varchar(10)"

  - name: "employee_name"
    description: "Employee's full name"
    role: "dimension"
    type: "varchar(80)"

  - name: "department"
    description: "Employee's department at time of submission"
    role: "dimension"
    type: "varchar(40)"

  - name: "category"
    description: "Expense category: Travel, Meals, Supplies, or Other"
    role: "dimension"
    type: "varchar(20)"

  - name: "expense_date"
    description: "Date the expense was actually incurred"
    role: "dimension"
    type: "date"

  - name: "submitted_date"
    description: "Date the claim was submitted for approval"
    role: "dimension"
    type: "date"

  - name: "approved_date"
    description: "Date the claim was approved (blank if not yet approved)"
    role: "dimension"
    type: "date"

  - name: "approved_flag"
    description: "Y if approved, N if not yet approved or rejected"
    role: "dimension"
    type: "varchar(1)"

  - name: "amount_usd"
    description: "Claimed amount in USD"
    role: "measure"
    type: "decimal(10,2)"

  - name: "reimbursable_amount"
    description: "Amount eligible for reimbursement"
    role: "measure"
    type: "decimal(10,2)"
    computed: true
    expression: "if approved_flag = 'Y', the reimbursable amount is the full claimed amount_usd; otherwise it's 0"

  - name: "days_to_approval"
    description: "Number of days between submitted_date and approved_date for approved claims"
    role: "measure"
    type: "integer"
    computed: true
    expression: "for approved claims, the number of days between submitted_date and approved_date"
    note: "Not meaningful for claims that are not yet approved"  # AI-flagged uncertainty

unresolved_notes:
  - "approved_date is nullable (blank if not yet approved); days_to_approval computation should handle null approved_date by returning null"
  - "reimbursable_amount expression assumes 0 for unapproved/rejected claims; confirm whether rejected claims are indicated by approved_flag = 'N' or a separate status field"
