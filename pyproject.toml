[project]
name = "structifact"
version = "0.5.0"
description = "Define once. Generate everywhere."
authors = [
    {name = "Michael S. Lewis"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "PyYAML>=6.0"
]

[project.optional-dependencies]
excel = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

ai = [
    "anthropic>=0.40",
]

duckdb = [
    "duckdb>=0.10",
]

postgres = [
    "psycopg2-binary>=2.9",
]

dev = [
    "pytest",
    "jsonschema>=4.0",
]

all = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "duckdb>=0.10",
    "psycopg2-binary>=2.9",
    "pytest",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/michaelslewis/structifact"
Repository = "https://github.com/michaelslewis/structifact"
Issues = "https://github.com/michaelslewis/structifact/issues"

[project.scripts]
structifact = "structifact.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["structifact*"]
exclude = ["output*"]
